# Unit and parity tests (npm test) and the type tests (npm run test:types)
# on every push and pull request, on Node 22.22 (the oldest Node that jsdom 30
# and its undici declare support for; package.json engines still says
# >=22.12) and the current LTS.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:types
