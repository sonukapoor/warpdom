# Web Platform Tests conformance on GitHub-hosted runners: warpdom and jsdom
# side by side (wpt/run.mjs), one job per WPT area, at a pinned WPT commit,
# and a final job that merges the areas and writes the summary tables
# (per directory, per engine, side by side) to the run's summary page and
# an artifact. See wpt/README.md for the method and its limits.
name: wpt

on:
  workflow_dispatch:
    inputs:
      areas:
        description: WPT directories, one job each (space separated)
        default: dom domparsing html/dom css/cssom
      wpt_ref:
        description: 'WPT commit (default is the commit of the 2026-10-11 run)'
        default: 87b5d13099c8bc2f9047ce1d29c963a3e0a246f6
      engines:
        default: warpdom,jsdom
      jobs:
        description: Test files in parallel per job
        default: '2'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.list.outputs.areas }}
    steps:
      - id: list
        run: echo "areas=$(echo '${{ inputs.areas }}' | jq -cR 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: npm ci
      - name: WPT at ${{ inputs.wpt_ref }} (sparse)
        run: |
          git init -q wpt-checkout
          cd wpt-checkout
          git remote add origin https://github.com/web-platform-tests/wpt.git
          git sparse-checkout set "${{ matrix.area }}" resources common interfaces
          git fetch -q --depth 1 --filter=blob:none origin "${{ inputs.wpt_ref }}"
          git checkout -q FETCH_HEAD
      - id: slug
        run: echo "slug=$(echo '${{ matrix.area }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Run ${{ matrix.area }}
        run: node wpt/run.mjs "${{ matrix.area }}" --engine "${{ inputs.engines }}" --jobs "${{ inputs.jobs }}" --wpt wpt-checkout --out "wpt-out/${{ steps.slug.outputs.slug }}" --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpt-${{ steps.slug.outputs.slug }}
          path: wpt-out/

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          pattern: wpt-*
          path: wpt-out
          merge-multiple: true
      - name: Merge areas and summarize
        run: |
          set -e
          mkdir -p merged
          for engine in $(echo '${{ inputs.engines }}' | tr ',' ' '); do
            node wpt/merge.mjs "merged/$engine.json" wpt-out/*/"$engine.json"
          done
          node wpt/summary.mjs merged --depth 2 | tee merged/summary.md
          { echo '## WPT (merged areas)'; echo; cat merged/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wpt-report
          path: merged/
