# Web Platform Tests conformance on GitHub-hosted runners: warpdom and jsdom
# side by side (wpt/run.mjs), one job per WPT area, at a pinned WPT commit,
# and a final job that merges the areas and writes the summary tables
# (per directory, per engine, side by side) to the run's summary page and
# an artifact. See wpt/README.md for the method and its limits.
name: wpt

on:
  # Monthly, at the newest WPT commit with the default areas and engines:
  # shows whether new or changed tests move warpdom's pass rate against
  # jsdom's (the run's summary page has the tables).
  schedule:
    - cron: '41 6 2 * *'
  workflow_dispatch:
    inputs:
      areas:
        description: 'WPT directories, one job each (space separated); dir~sub1~sub2 runs dir without its subdirectories sub1, sub2'
        default: dom domparsing html/dom css/cssom css/cssom-view html/semantics/forms html/semantics/interactive-elements url FileAPI encoding~legacy-mb-japanese~legacy-mb-korean~legacy-mb-schinese~legacy-mb-tchinese~streams encoding/legacy-mb-japanese encoding/legacy-mb-korean encoding/legacy-mb-schinese encoding/legacy-mb-tchinese encoding/streams WebCryptoAPI hr-time user-timing resize-observer intersection-observer web-animations/interfaces xhr
      wpt_ref:
        description: 'WPT commit or ref (HEAD = newest; the 2026-10-11 paper run used 87b5d13099c8bc2f9047ce1d29c963a3e0a246f6)'
        default: HEAD
      engines:
        default: warpdom,jsdom
      jobs:
        description: Test files in parallel per job
        default: '2'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      areas: ${{ steps.list.outputs.areas }}
    steps:
      - id: list
        run: echo "areas=$(echo '${{ inputs.areas || 'dom domparsing html/dom css/cssom css/cssom-view html/semantics/forms html/semantics/interactive-elements url FileAPI encoding~legacy-mb-japanese~legacy-mb-korean~legacy-mb-schinese~legacy-mb-tchinese~streams encoding/legacy-mb-japanese encoding/legacy-mb-korean encoding/legacy-mb-schinese encoding/legacy-mb-tchinese encoding/streams WebCryptoAPI hr-time user-timing resize-observer intersection-observer web-animations/interfaces xhr' }}' | jq -cR 'split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - run: npm ci
      - name: WPT at ${{ inputs.wpt_ref || 'HEAD' }} (sparse)
        env:
          AREA: ${{ matrix.area }}
        run: |
          git init -q wpt-checkout
          cd wpt-checkout
          git remote add origin https://github.com/web-platform-tests/wpt.git
          git sparse-checkout set "${AREA%%~*}" resources common interfaces
          git fetch -q --depth 1 --filter=blob:none origin "${{ inputs.wpt_ref || 'HEAD' }}"
          git checkout -q FETCH_HEAD
      - id: slug
        run: echo "slug=$(echo '${{ matrix.area }}' | tr '/~' '--')" >> "$GITHUB_OUTPUT"
      - name: Run ${{ matrix.area }}
        env:
          AREA: ${{ matrix.area }}
        run: |
          base="${AREA%%~*}"; excl=()
          if [ "$base" != "$AREA" ]; then IFS='~' read -ra parts <<< "${AREA#*~}"; for p in "${parts[@]}"; do excl+=(--exclude "$base/$p"); done; fi
          node wpt/run.mjs "$base" "${excl[@]}" --engine "${{ inputs.engines || 'warpdom,jsdom' }}" --jobs "${{ inputs.jobs || '2' }}" --wpt wpt-checkout --out "wpt-out/${{ steps.slug.outputs.slug }}" --quiet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wpt-${{ steps.slug.outputs.slug }}
          path: wpt-out/

  report:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v8
        with:
          pattern: wpt-*
          path: wpt-out
          merge-multiple: true
      - name: Merge areas and summarize
        run: |
          set -e
          mkdir -p merged
          for engine in $(echo '${{ inputs.engines || 'warpdom,jsdom' }}' | tr ',' ' '); do
            node wpt/merge.mjs "merged/$engine.json" wpt-out/*/"$engine.json"
          done
          node wpt/summary.mjs merged --depth 2 | tee merged/summary.md
          { echo '## WPT (merged areas)'; echo; cat merged/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: wpt-report
          path: merged/
