# OpenSSF Scorecard supply-chain checks (from the official starter workflow):
# weekly, on pushes to main and on branch protection changes. Results are
# published to the OpenSSF API (for the README badge) and uploaded to GitHub
# Code Scanning.
name: scorecard

on:
  # For the Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check current.
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # publish_results only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Upload the results to Code Scanning.
      security-events: write
      # Publish the results and get a badge.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The Branch-Protection check on a public repository needs a
          # fine-grained PAT with read access to administration settings:
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
