# Publishes a release when a tag vX.Y.Z is pushed (RELEASING.md). The build
# job runs the tests, checks that the tag matches package.json and
# src/version.js and is on main, and packs warpdom and the companion packages
# in packages/. The publish job, the only one that can get an npm OIDC token,
# installs nothing from the project: it publishes the packed tarballs whose
# version is not on npm yet, with npm trusted publishing (no token) and
# provenance. Then the GitHub release is created from
# docs/release-notes/vX.Y.Z.md (or generated notes).
#
# workflow_dispatch runs the same steps; with dry_run (the default) nothing is
# published: npm publish --dry-run shows each tarball and the release notes
# are printed. A real run from workflow_dispatch needs a tag as the ref (it
# retries a failed release; versions already on npm are skipped).
#
# Set the repository variable NPM_PUBLISH_MODE to "stage" to stage the
# packages instead (npm stage publish; a maintainer approves each one with 2FA
# on npmjs.com before it is public); the GitHub release is then created as a
# draft, to publish after the approval. The npm trusted publisher must allow
# the command used: "npm stage publish" is always allowed, "npm publish" only
# when ticked under Allowed actions.
#
# Actions are pinned to commit SHAs (the release tag in the comment).
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, test and pack, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time; up to 100 runs wait instead of replacing each other.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check that the tag is on main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false # no caches in release builds

      - name: Check the tag, package.json and src/version.js
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          source_version=$(node -p "/VERSION = '([^']+)'/.exec(require('fs').readFileSync('src/version.js', 'utf8'))[1]")
          if [ "$version" != "$source_version" ]; then
            echo "::error::package.json is $version but src/version.js is $source_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main"
              exit 1
            fi
          elif [ "$DRY_RUN" != true ]; then
            echo "::error::a real release needs a tag (run this workflow from the tag v$version, or with dry_run)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "warpdom $version, dry run: $DRY_RUN"

      - run: npm ci
      - run: npm test
      - run: npm run test:types

      # packs.txt lists name@version and tarball, in publishing order.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in . packages/vitest-environment-warpdom packages/jest-environment-warpdom; do
            (cd "$dir" && npm pack --pack-destination "$RUNNER_TEMP/packs")
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            file="$name-$version.tgz"
            test -f "$RUNNER_TEMP/packs/$file"
            echo "$name@$version $file" >> "$RUNNER_TEMP/packs/packs.txt"
          done
          cat "$RUNNER_TEMP/packs/packs.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packs
          path: ${{ runner.temp }}/packs
          if-no-files-found: error
          retention-days: 7

      - name: Release notes (dry run)
        if: env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          notes="docs/release-notes/v$VERSION.md"
          if [ -f "$notes" ]; then cat "$notes"; else echo "No $notes: the release would use generated notes."; fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # npm trusted publishing (OIDC) and provenance
    outputs:
      published: ${{ steps.publish.outputs.published }}
      mode: ${{ steps.publish.outputs.mode }}
    env:
      PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'publish' }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1, npm stage publish >= 11.15.
      - run: npm install -g npm@11.21.0 && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: packs

      - name: Publish to npm
        id: publish
        working-directory: packs
        run: |
          case "$PUBLISH_MODE" in
            publish) cmd=(npm publish) ;;
            stage) cmd=(npm stage publish) ;;
            *) echo "::error::NPM_PUBLISH_MODE must be publish or stage, not $PUBLISH_MODE"; exit 1 ;;
          esac
          flags=(--provenance --access public)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          published=()
          while read -r spec file; do
            # Also in a dry run: npm publish --dry-run fails on a version
            # that is on npm. The build job's Pack step lists every tarball.
            if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
              echo "$spec is already on npm, skipped"
              continue
            fi
            echo "::group::${cmd[*]} $spec"
            "${cmd[@]}" "./$file" "${flags[@]}"
            echo "::endgroup::"
            published+=("$spec")
          done < packs.txt
          echo "published=${published[*]}" >> "$GITHUB_OUTPUT"
          echo "mode=$PUBLISH_MODE" >> "$GITHUB_OUTPUT"

  github-release:
    needs: [build, publish]
    if: github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Staged packages are not public until approved, so the release is a
      # draft, published by hand after the approval (RELEASING.md).
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
          MODE: ${{ needs.publish.outputs.mode }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, left as is"
            exit 0
          fi
          draft=()
          if [ "$MODE" = stage ] && [ -n "$PUBLISHED" ]; then
            draft=(--draft)
            echo "::notice::staged on npm: $PUBLISHED. Release $tag created as a draft; publish it after approving them."
          fi
          footer="npm: \`warpdom@$VERSION\`"
          for pkg in $PUBLISHED; do
            case "$pkg" in warpdom@*) ;; *) footer="$footer, \`$pkg\`" ;; esac
          done
          notes="docs/release-notes/$tag.md"
          if [ -f "$notes" ]; then
            body=$(cat "$notes")
          else
            # GitHub's generated notes; gh's --generate-notes would put
            # --notes before them, so the footer is appended here.
            body=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" --jq .body)
          fi
          if ! grep -q '^npm: ' <<< "$body"; then body="$body"$'\n\n'"$footer"; fi
          gh release create "$tag" --verify-tag "${draft[@]}" --title "warpdom $VERSION" --notes "$body"
