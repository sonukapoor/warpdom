# Publishes a release when a tag vX.Y.Z is pushed (RELEASING.md): runs the
# tests, checks that the tag matches package.json and src/version.js and is on
# main, publishes warpdom (and a companion package in packages/ whose version
# is not on npm yet) with npm trusted publishing (OIDC, no token) and
# provenance, then creates the GitHub release from
# docs/release-notes/vX.Y.Z.md (or generated notes).
#
# workflow_dispatch runs the same steps; with dry_run (the default) nothing is
# published: npm publish --dry-run shows each tarball and the release notes
# are printed. A real run from workflow_dispatch needs a tag as the ref (it
# retries a failed release; versions already on npm are skipped).
#
# Set the repository variable NPM_PUBLISH_MODE to "stage" to stage the
# packages instead (npm stage publish; a maintainer approves each one with 2FA
# on npmjs.com before it is public). The npm trusted publisher must allow the
# command used: "npm stage publish" is always allowed, "npm publish" only when
# ticked under Allowed actions.
name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build, test and pack, publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    outputs:
      version: ${{ steps.check.outputs.version }}
      published: ${{ steps.publish.outputs.published }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      PUBLISH_MODE: ${{ vars.NPM_PUBLISH_MODE || 'publish' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check that the tag is on main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no caches in release builds
      # Trusted publishing needs npm >= 11.5.1, npm stage publish >= 11.15.
      - run: npm install -g npm@11.21.0 && npm --version

      - name: Check the tag, package.json and src/version.js
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          source_version=$(node -p "/VERSION = '([^']+)'/.exec(require('fs').readFileSync('src/version.js', 'utf8'))[1]")
          if [ "$version" != "$source_version" ]; then
            echo "::error::package.json is $version but src/version.js is $source_version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME is not on main"
              exit 1
            fi
          elif [ "$DRY_RUN" != true ]; then
            echo "::error::a real release needs a tag (run this workflow from the tag v$version, or with dry_run)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "warpdom $version, dry run: $DRY_RUN, mode: $PUBLISH_MODE"

      - run: npm ci
      - run: npm test
      - run: npm run test:types

      - name: Publish to npm
        id: publish
        run: |
          case "$PUBLISH_MODE" in
            publish) cmd=(npm publish) ;;
            stage) cmd=(npm stage publish) ;;
            *) echo "::error::NPM_PUBLISH_MODE must be publish or stage, not $PUBLISH_MODE"; exit 1 ;;
          esac
          flags=(--provenance --access public)
          [ "$DRY_RUN" = true ] && flags+=(--dry-run)
          published=()
          for dir in . packages/vitest-environment-warpdom packages/jest-environment-warpdom; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm, skipped"
              continue
            fi
            echo "::group::${cmd[*]} $name@$version"
            (cd "$dir" && "${cmd[@]}" "${flags[@]}")
            echo "::endgroup::"
            published+=("$name@$version")
          done
          echo "published=${published[*]}" >> "$GITHUB_OUTPUT"

      - name: Release notes (dry run)
        if: env.DRY_RUN == 'true'
        run: |
          notes="docs/release-notes/v${{ steps.check.outputs.version }}.md"
          if [ -f "$notes" ]; then cat "$notes"; else echo "No $notes: the release would use generated notes."; fi

  github-release:
    needs: publish
    if: github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists, left as is"
            exit 0
          fi
          footer="npm: \`warpdom@$VERSION\`"
          for pkg in $PUBLISHED; do
            case "$pkg" in warpdom@*) ;; *) footer="$footer, \`$pkg\`" ;; esac
          done
          notes="docs/release-notes/$tag.md"
          if [ -f "$notes" ]; then
            body=$(cat "$notes")
            if ! grep -q '^npm: ' "$notes"; then body="$body"$'\n\n'"$footer"; fi
            gh release create "$tag" --verify-tag --title "warpdom $VERSION" --notes "$body"
          else
            gh release create "$tag" --verify-tag --title "warpdom $VERSION" --generate-notes --notes "$footer"
          fi
