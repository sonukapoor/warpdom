<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>CPU time by category, jsdom and warpdom</title>
<defs>
  <pattern id="diag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1.6"/>
  </pattern>
  <pattern id="rdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
    <rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#000" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="#fff"/><circle cx="2.5" cy="2.5" r="1.1" fill="#000"/>
  </pattern>
  <pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="#fff"/><path d="M0 3H6M3 0V6" stroke="#000" stroke-width="0.8"/>
  </pattern>
  <pattern id="horiz" width="5" height="5" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="#fff"/><line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#000" stroke-width="1"/>
  </pattern>
</defs>
<rect width="720" height="284" fill="#fff"/>
<text x="130" y="18" font-weight="bold">Sampled CPU time of test processes by category (idle excluded), seconds</text><rect x="130.0" y="30.0" width="14.0" height="10.0" fill="#000" stroke="#000" stroke-width="0.7" /><text x="149" y="40" >DOM (incl. parse5)</text><rect x="286.4" y="30.0" width="14.0" height="10.0" fill="url(#diag)" stroke="#000" stroke-width="0.7" /><text x="305.4" y="40" >framework</text><rect x="381.6" y="30.0" width="14.0" height="10.0" fill="url(#dots)" stroke="#000" stroke-width="0.7" /><text x="400.59999999999997" y="40" >Testing Library</text><rect x="517.6" y="30.0" width="14.0" height="10.0" fill="#888" stroke="#000" stroke-width="0.7" /><text x="536.5999999999999" y="40" >runner</text><rect x="130.0" y="50.0" width="14.0" height="10.0" fill="url(#cross)" stroke="#000" stroke-width="0.7" /><text x="149" y="60" >Node internals</text><rect x="259.2" y="50.0" width="14.0" height="10.0" fill="url(#horiz)" stroke="#000" stroke-width="0.7" /><text x="278.2" y="60" >transforms</text><rect x="361.2" y="50.0" width="14.0" height="10.0" fill="#ccc" stroke="#000" stroke-width="0.7" /><text x="380.2" y="60" >project code</text><rect x="476.8" y="50.0" width="14.0" height="10.0" fill="#fff" stroke="#000" stroke-width="0.7" /><text x="495.79999999999995" y="60" >GC, other deps, other</text><text x="122" y="103" text-anchor="end">ariakit, jsdom</text><rect x="130.0" y="86.0" width="166.7" height="26.0" fill="#000" stroke="#000" stroke-width="0.7" /><text x="298.72387916338846" y="83" font-size="10">DOM 40.7% = 130.8 s</text><rect x="296.7" y="86.0" width="66.9" height="26.0" fill="url(#diag)" stroke="#000" stroke-width="0.7" /><rect x="363.6" y="86.0" width="14.6" height="26.0" fill="url(#dots)" stroke="#000" stroke-width="0.7" /><rect x="378.2" y="86.0" width="39.6" height="26.0" fill="#888" stroke="#000" stroke-width="0.7" /><rect x="417.8" y="86.0" width="17.8" height="26.0" fill="url(#cross)" stroke="#000" stroke-width="0.7" /><rect x="435.7" y="86.0" width="6.6" height="26.0" fill="url(#horiz)" stroke="#000" stroke-width="0.7" /><rect x="442.3" y="86.0" width="38.5" height="26.0" fill="#ccc" stroke="#000" stroke-width="0.7" /><rect x="480.8" y="86.0" width="59.2" height="26.0" fill="#fff" stroke="#000" stroke-width="0.7" /><text x="546" y="103" font-size="10">321.7 s; idle 871.9 s</text><text x="122" y="149" text-anchor="end">ariakit, warpdom</text><rect x="130.0" y="132.0" width="22.2" height="26.0" fill="#000" stroke="#000" stroke-width="0.7" /><text x="154.24410098956054" y="129" font-size="10">DOM 9.7% = 17.5 s</text><rect x="152.2" y="132.0" width="62.1" height="26.0" fill="url(#diag)" stroke="#000" stroke-width="0.7" /><rect x="214.4" y="132.0" width="13.8" height="26.0" fill="url(#dots)" stroke="#000" stroke-width="0.7" /><rect x="228.2" y="132.0" width="32.1" height="26.0" fill="#888" stroke="#000" stroke-width="0.7" /><rect x="260.3" y="132.0" width="19.5" height="26.0" fill="url(#cross)" stroke="#000" stroke-width="0.7" /><rect x="279.8" y="132.0" width="10.1" height="26.0" fill="url(#horiz)" stroke="#000" stroke-width="0.7" /><rect x="289.9" y="132.0" width="35.7" height="26.0" fill="#ccc" stroke="#000" stroke-width="0.7" /><rect x="325.6" y="132.0" width="34.5" height="26.0" fill="#fff" stroke="#000" stroke-width="0.7" /><text x="366.07056702312855" y="149" font-size="10">180.5 s; idle 824.6 s</text><text x="122" y="195" text-anchor="end">MUI, warpdom</text><rect x="130.0" y="178.0" width="13.3" height="26.0" fill="#000" stroke="#000" stroke-width="0.7" /><text x="145.28199639393185" y="175" font-size="10">DOM 11.3% = 10.4 s</text><rect x="143.3" y="178.0" width="18.9" height="26.0" fill="url(#diag)" stroke="#000" stroke-width="0.7" /><rect x="162.2" y="178.0" width="11.0" height="26.0" fill="url(#dots)" stroke="#000" stroke-width="0.7" /><rect x="173.3" y="178.0" width="21.2" height="26.0" fill="#888" stroke="#000" stroke-width="0.7" /><rect x="194.4" y="178.0" width="22.5" height="26.0" fill="url(#cross)" stroke="#000" stroke-width="0.7" /><rect x="216.9" y="178.0" width="5.6" height="26.0" fill="url(#horiz)" stroke="#000" stroke-width="0.7" /><rect x="222.5" y="178.0" width="4.3" height="26.0" fill="#ccc" stroke="#000" stroke-width="0.7" /><rect x="226.9" y="178.0" width="20.6" height="26.0" fill="#fff" stroke="#000" stroke-width="0.7" /><text x="253.42225130564537" y="195" font-size="10">92.2 s</text><text x="130" y="258" font-size="10">ariakit: 2026-10-12, laptop (shares usable, wall times not). MUI: four packages, 2026-10-11, warpdom only.</text><text x="130" y="272" font-size="10">Idle = summed time test processes spent waiting (timers, animation frames).</text>
</svg>
