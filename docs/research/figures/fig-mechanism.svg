<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="770" height="440" viewBox="0 0 770 440" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>How measured isolation runs</title>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#000"/>
  </marker>
</defs>
<rect width="770" height="440" fill="#fff"/>
<rect x="20" y="20" width="400" height="158" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><text x="28" y="37" font-weight="bold">1  Learning run (once, or with --learn)</text><text x="28" y="55" font-size="11">a. run every file isolated: time t_iso; this result is reported</text><text x="28" y="70" font-size="11">b. run every file shared, DOM reset in place before each file</text><text x="28" y="85" font-size="11">c. files to isolate, L: a test whose status differs, a missing test</text><text x="28" y="100" font-size="11">   or file, a failure, or an unhandled error (counted against the</text><text x="28" y="115" font-size="11">   test file its stack names)</text><text x="28" y="130" font-size="11">d. split run (L isolated, rest shared); files still differing join L,</text><text x="28" y="145" font-size="11">   up to 4 split runs; time t_split</text><text x="28" y="160" font-size="11">e. split if results = isolated and t_split &lt; t_iso - max(5%, 0.5 s)</text><rect x="470" y="60" width="170" height="70" rx="4" fill="#eee" stroke="#000" stroke-width="1"/><text x="478" y="77" font-weight="bold">Stored state</text><text x="478" y="95" font-size="11">mode and files L</text><text x="478" y="110" font-size="11">(.warpdom/fast-mode.json)</text><path d="M420 95 L466 95" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#head)"/><rect x="20" y="215" width="560" height="135" rx="4" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/><text x="28" y="232" font-weight="bold">2  Later runs in split mode: one runner invocation, two projects</text><rect x="32" y="245" width="250" height="92" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><text x="40" y="262" font-weight="bold">Isolated project: files in L</text><text x="40" y="280" font-size="11">each file: fresh window and</text><text x="40" y="295" font-size="11">fresh module registry</text><text x="40" y="310" font-size="11">(as the runner's default)</text><rect x="318" y="245" width="250" height="92" rx="4" fill="#f2f2f2" stroke="#000" stroke-width="1"/><text x="326" y="262" font-weight="bold">Shared project: all other files</text><text x="326" y="280" font-size="11">modules shared within a worker;</text><text x="326" y="295" font-size="11">DOM reset in place before each file</text><text x="326" y="310" font-size="11">(same window, document, interfaces)</text><path d="M555 130 L555 200 L300 200 L300 211" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#head)"/><text x="563" y="180" font-size="11" font-style="italic">mode = split, L</text><rect x="605" y="215" width="150" height="135" rx="4" fill="#fff" stroke="#000" stroke-width="1"/><text x="613" y="232" font-weight="bold">3  Safety net</text><text x="613" y="250" font-size="11">a shared file that</text><text x="613" y="265" font-size="11">fails: re-run isolated,</text><text x="613" y="280" font-size="11">its isolated result</text><text x="613" y="295" font-size="11">counts; it joins L.</text><text x="613" y="310" font-size="11">Split no faster than</text><text x="613" y="325" font-size="11">t_iso: mode isolated</text><path d="M580 290 L601 290" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#head)"/><text x="578" y="283" font-size="11" font-style="italic">fails</text><path d="M680 215 L680 95 L644 95" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#head)"/><text x="688" y="160" font-size="11" font-style="italic">update</text><rect x="20" y="375" width="735" height="45" rx="4" fill="#eee" stroke="#000" stroke-width="1"/><text x="28" y="392" font-weight="bold">Reported result</text><text x="28" y="410" font-size="11">isolated outcomes for files in L and for re-run files; shared outcomes for files that did not fail. Isolated mode = a plain runner call.</text><path d="M300 350 L300 371" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#head)"/><path d="M680 350 L680 371" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#head)"/>
</svg>
